# Rev0 | 기본 Zephyr(NCS) 스캐폴드 설정
# 보드/드라이버 세부 설정(NRFX_RTC 인스턴스, I2C, PWM, BT 등)은
# 실제 보드가 확정된 뒤 devicetree overlay(Application/app.overlay)와 함께 추가한다
# (architecture.md §11).

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# pinmap.md: PoC v1은 UART 핀이 노출되어 있지 않다 (SWD만 사용 가능) — 로그는
# UART 콘솔이 아니라 RTT(디버그 인터페이스로 전송)로만 확인 가능하다.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_MAIN_STACK_SIZE=2048

# m_ctrl_request_reset()의 sys_reboot() 호출에 필요 (architecture.md §3)
CONFIG_REBOOT=y

# RTC2를 nrfx로 직접 제어하기 위해 활성화 (architecture.md §2.3).
# 이 NCS 버전은 인스턴스별 Kconfig가 없고 NRFX_RTC 하나로 전체 RTC 드라이버를 켠다.
# IRQ 연결은 m_i2c_rtc.c에서 IRQ_CONNECT()로 직접 처리한다 (실기 검증 완료, 2026-09-14).
CONFIG_NRFX_RTC=y

# LED PWM 구동 (pinmap.md §2, app.overlay의 pwm0 노드). PoC v1 실기 검증 대기 중.
CONFIG_PWM=y

