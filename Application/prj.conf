# Rev0 | 기본 Zephyr(NCS) 스캐폴드 설정
# 보드/드라이버 세부 설정(NRFX_RTC 인스턴스, I2C, PWM, BT 등)은
# 실제 보드가 확정된 뒤 devicetree overlay(Application/app.overlay)와 함께 추가한다
# (architecture.md §11).

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# pinmap.md: PoC v1은 UART 핀이 노출되어 있지 않다 (SWD만 사용 가능) — 로그는
# UART 콘솔이 아니라 RTT(디버그 인터페이스로 전송)로만 확인 가능하다.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# 기본 RTT up-buffer(1KB)는 "연결 중엔 로깅 안 함 -> 끊긴 뒤 한꺼번에 dump" 방식(m_ble_proto.c,
# 2026-09-15)과 맞지 않는다 — 세션 내내 아무도 안 읽고 있다가 disconnect 시점에 몰아서 로그를
# 찍으면 SEGGER_RTT_MODE_NO_BLOCK_SKIP(기본값) 특성상 버퍼가 가득 차서 뒷부분(정작 필요한
# write dump)이 유실됨을 실기에서 확인. 버퍼를 키워서 한 세션 분량 로그가 다 들어가게 한다.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_MAIN_STACK_SIZE=2048

# m_ctrl_request_reset()의 sys_reboot() 호출에 필요 (architecture.md §3)
CONFIG_REBOOT=y

# Watchdog (Rev3, R3-1, 2026-09-16) — nRF52832 wdt0는 SoC dts에서 기본 status=okay라
# devicetree overlay 없이 이 옵션만으로 사용 가능 (m_ctrl.c 참고).
CONFIG_WATCHDOG=y

# RTC2를 nrfx로 직접 제어하기 위해 활성화 (architecture.md §2.3).
# 이 NCS 버전은 인스턴스별 Kconfig가 없고 NRFX_RTC 하나로 전체 RTC 드라이버를 켠다.
# IRQ 연결은 m_i2c_rtc.c에서 IRQ_CONNECT()로 직접 처리한다 (실기 검증 완료, 2026-09-14).
CONFIG_NRFX_RTC=y

# LED PWM 구동 (pinmap.md §2, app.overlay의 pwm0 노드). PoC v1 실기 검증 완료(v0.0.3).
CONFIG_PWM=y

# AS7341 NIR1 I2C 드라이버 (pinmap.md §3, app.overlay의 i2c1 노드).
CONFIG_I2C=y

# BLE 실 스택 착수 (2026-09-15) — 테스트 APK(fnirs-visualizer-app-release.apk) 호환
# 연동이 목적이라, 정식 프로덕션 프로토콜(S2 정책: Tx power -8dBm 고정, MTU 251byte 등)은
# 아직 적용하지 않는다 (m_ble.c TODO 참고).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF_fNIRS_Sys_v2"

